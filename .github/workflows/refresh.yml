name: Refresh catalogs

# Runs lib/refresh.js daily and writes the resulting blobs to the Azure Blob
# storage account that backs the addon's Function App. GitHub Actions gives us
# a 30-minute budget — plenty for the full 25-year backfill.
#
# Required repo secrets:
#   AZURE_STORAGE_CONNECTION_STRING — Standard storage account, full perms
#   TMDB_API_KEY                    — server-side TMDB key

on:
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily (~3am Pacific)
  workflow_dispatch: {} # lets you fire it manually from the Actions tab

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run refresh
        env:
          STORAGE_BACKEND: azure
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: catalogs
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Pull 25 years of festivals / 25 editions of awards. The default
          # (10) was a leftover from when we ran on Vercel's 60s timeout —
          # GitHub Actions gives us 30 minutes, so we use it. Older years
          # (Sundance pre-2003, etc.) that 404 on Wikipedia just yield 0
          # films and are skipped without failing the run.
          REFRESH_YEARS_BACK: "25"
        run: node scripts/refresh-cli.js
